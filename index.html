<style>
/* Layout: two screens. Home = left sidebar + notes grid + round add button. Editor = toolbar on top (tools, colors, size, pages, zoom) over a scrolling desk with one A4 canvas. Dark first. */
:root{
  --desk:#08080b; --chrome:#141217; --side:#18151b; --card:#131116; --cardh:#1d1a21;
  --fg:#ebe8f0; --muted:#9a95a6; --line:#34303b;
  --accent:#6a9bff; --accent-fg:#06122b; --accent-soft:#25335c; --chip:#2a3a68; --chip-fg:#a9c1ff;
  --fab:#3d7bf0; --fab-fg:#ffffff; --danger:#ff7b71;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  --f-ui:system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif; --f-brand:system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --desk:#eeedf3; --chrome:#ffffff; --side:#ffffff; --card:#ffffff; --cardh:#f6f5fa;
  --fg:#1b1920; --muted:#6b6773; --line:#dcdae4;
  --accent:#2f62d6; --accent-fg:#ffffff; --accent-soft:#dfe7ff; --chip:#d9e3ff; --chip-fg:#1f47a8;
  --fab:#2f62d6; --fab-fg:#ffffff; --danger:#c93a31;
  --shadow:0 1px 2px rgba(20,20,40,.12),0 10px 30px rgba(20,20,40,.16); --scrim:rgba(14,14,24,.4); color-scheme:light}}
:root[data-theme="light"]{
  --desk:#eeedf3; --chrome:#ffffff; --side:#ffffff; --card:#ffffff; --cardh:#f6f5fa;
  --fg:#1b1920; --muted:#6b6773; --line:#dcdae4;
  --accent:#2f62d6; --accent-fg:#ffffff; --accent-soft:#dfe7ff; --chip:#d9e3ff; --chip-fg:#1f47a8;
  --fab:#2f62d6; --fab-fg:#ffffff; --danger:#c93a31;
  --shadow:0 1px 2px rgba(20,20,40,.12),0 10px 30px rgba(20,20,40,.16); --scrim:rgba(14,14,24,.4); color-scheme:light}

html,body{height:100%}
body{margin:0}
img{max-width:100%}
:root{--hud:rgba(26,29,42,.94);--hudline:rgba(255,255,255,.1)}

:root[data-theme="light"]{--hud:rgba(255,255,255,.96);--hudline:rgba(20,20,40,.12)}
.hud{direction:ltr;position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px))}
.hrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.pill{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--hud);border:1px solid var(--hudline);border-radius:30px;padding:4px 6px;box-shadow:0 6px 22px rgba(0,0,0,.35);min-width:0;max-width:100%;backdrop-filter:blur(8px)}
.pill .ib{width:40px;height:40px;border-radius:50%}
.pill{overflow-x:auto;scrollbar-width:none}.pill::-webkit-scrollbar{display:none}
.pill>*{flex:none}
.pill .tools{flex:none}
.pill .ib.sm{width:30px;height:36px}
.pill .ib[aria-pressed="true"]{background:var(--chip);color:var(--chip-fg)}
.vsep{width:1px;height:26px;background:var(--hudline);margin:0 5px;flex:none}
.pill .tools{background:none;padding:0;gap:2px}
.pill .tool{width:42px;height:40px;border-radius:50%}
.pill .pct{min-width:48px;height:36px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill .ttl{padding:0 10px 0 6px;max-width:150px;direction:rtl;text-align:right}
#pS{overflow-x:auto;scrollbar-width:none}
#pS::-webkit-scrollbar{display:none}
.szs{display:flex;gap:2px;flex:none}
.szb{width:46px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.szb i{display:block;width:26px;border-radius:99px;background:currentColor}
.szb[aria-pressed="true"]{background:var(--chip);color:var(--chip-fg)}
#pS .sw{flex:none;overflow:visible;padding:5px 3px}
#toolNote{pointer-events:none;background:var(--hud);border:1px solid var(--hudline);border-radius:20px;padding:6px 14px}
@media (max-width:760px){.pill .ttl{display:none}.hrow{gap:6px}}
body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--accent-soft)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.btn{padding:9px 16px;border-radius:12px;border:1px solid var(--line);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
[hidden]{display:none!important}
#root{height:100%;min-height:0}

/* ===== Home ===== */
#vHome{height:100%;display:flex;direction:ltr}
.side{width:248px;flex:none;background:var(--side);direction:rtl;padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-brand);font-size:30px;font-weight:600;padding:2px 14px 14px}
.nv{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:999px;font-size:16px;width:100%;text-align:start}
.nv:hover{background:var(--accent-soft)}
.nv[aria-current="true"]{background:var(--chip);color:var(--chip-fg);font-weight:500}
.nv .n{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:10px 8px}
.main{flex:1;min-width:0;direction:rtl;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 120px max(24px,env(safe-area-inset-left,0px))}
.mtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mtop .ib.tg{display:none}
.sp{margin-inline-start:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:46px;background:var(--card);min-width:0;flex:0 1 280px}
.sp svg{color:var(--muted)}
.sp input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;outline:none;-webkit-user-select:text;user-select:text}
.hello{font-family:var(--f-brand);font-weight:600;font-size:clamp(34px,6vw,52px);line-height:1.15;margin:8px 0 4px}
.sub{color:var(--muted);font-size:16px;margin:0 0 26px}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:10px 22px;border-radius:999px;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.chip:hover{background:var(--accent-soft)}
.chip[aria-pressed="true"]{background:var(--chip);color:var(--chip-fg);font-weight:500}
.ctl2{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.ctl2 .btn{border:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--accent)}
.ch{background:var(--cardh);padding:12px 8px 12px 14px;display:flex;gap:6px;align-items:flex-start;min-height:78px}
.ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cd{font-size:12px;color:var(--muted)}
.cn{font-size:16px;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.ch .ib{width:34px;height:34px;color:var(--muted)}
.cth{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#fff}
.star{color:#ffcb3d;display:inline-block;vertical-align:-3px;margin-inline-end:4px}
.cards.list{grid-template-columns:1fr}
.cards.list .card{flex-direction:row-reverse}
.cards.list .cth{width:150px;aspect-ratio:4/3;flex:none}
.cards.list .ch{flex:1;min-height:0;align-items:center}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 12px;font-size:16px}
.fab{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:var(--fab);color:var(--fab-fg);display:grid;place-items:center;box-shadow:var(--shadow);z-index:5}
.fab .i{width:30px;height:30px;stroke-width:2.2}

/* ===== Editor ===== */
#vEdit{height:100%;display:flex;flex-direction:column;min-height:0;position:relative}
#vEdit .stage{padding-top:calc(132px + env(safe-area-inset-top,0px))}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--chrome);border-bottom:1px solid var(--line);flex:none;
  padding:6px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));padding-top:calc(6px + env(safe-area-inset-top,0px))}
.g{display:flex;align-items:center;gap:2px;min-width:0}
.g-head{flex:1 1 150px}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;padding:0 6px}
.ttl b{font-family:var(--f-brand);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:3px;background:var(--desk);border-radius:16px;padding:3px}
.tool{width:42px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--chip);color:var(--chip-fg)}
.g-col{flex:1 1 180px;gap:8px}
.sw{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:5px 3px;scrollbar-width:none;align-items:center}
.sw::-webkit-scrollbar{display:none}
.swb{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line)}
.swb[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.palb{width:34px;height:34px;border-radius:50%;flex:none;position:relative;background:conic-gradient(#ff5a5a,#ffb02e,#f4e842,#4fd36a,#27c2e6,#4d7bff,#b45cff,#ff5a5a)}
.palb i{position:absolute;inset:7px;border-radius:50%;background:var(--cur,#000);border:2px solid var(--chrome)}
.note{color:var(--muted);font-size:13px;padding:0 4px;white-space:nowrap}
.g-size{flex:1 1 110px}
.size{flex:1;min-width:80px;display:flex;align-items:center;gap:8px}
.size input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.dot{width:26px;height:26px;display:grid;place-items:center;flex:none}
.dot i{display:block;border-radius:50%}
.g-nav .ib{width:36px;height:36px;border-radius:11px}
.cnt{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.g-zoom button.pct{min-width:44px;height:36px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-zoom .ib{width:32px;height:36px;border-radius:10px}
.stage{flex:1;min-height:0;overflow:auto;direction:ltr;padding-top:calc(128px + env(safe-area-inset-top,0px));padding-bottom:28px;padding-inline:16px;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));scrollbar-width:thin}
.pg{position:relative;box-shadow:var(--shadow);line-height:0;background:#fff}
.cvp{position:absolute;left:0;top:0;display:block;touch-action:none;cursor:crosshair}
.ovp{position:absolute;left:0;top:0;pointer-events:none;display:block}
#pages{display:flex;flex-direction:column;align-items:center;width:max-content;min-width:100%}
.pg{flex:none}
.grp{display:flex;align-items:center;gap:2px;flex:none}
.grp[hidden]{display:none}
#selbar{z-index:4}
.hint{position:absolute;inset:0;display:grid;place-items:start center;padding-top:18%;pointer-events:none;direction:rtl;text-align:center;font-size:15px;line-height:1.7;color:rgba(110,120,150,.95)}
.hint b{display:block;font-family:var(--f-brand);font-size:22px;font-weight:600}
#selbar{position:absolute;display:flex;gap:2px;background:var(--chrome);border:1px solid var(--line);border-radius:14px;padding:3px;box-shadow:var(--shadow);line-height:1;direction:rtl;z-index:3}
#selbar .ib{width:40px;height:40px}
#ruler{position:fixed;z-index:6;width:680px;height:56px;border-radius:10px;background:rgba(138,180,255,.22);border:1.5px solid rgba(138,180,255,.8);touch-action:none;cursor:move;backdrop-filter:blur(1px)}
#ruler .rh{position:absolute;right:-22px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:#8ab4ff;border:2px solid #fff;touch-action:none;cursor:grab}
#ruler .rk{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.65) 0 1.5px,transparent 1.5px 20px) top/100% 10px no-repeat}
#ruler[hidden]{display:none}

/* ===== Overlays ===== */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--chrome);border-radius:26px 26px 0 0;box-shadow:var(--shadow);direction:rtl;max-height:86%;overflow:auto;
  padding:14px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));max-width:600px;margin:0 auto}
.shh{display:flex;align-items:center;margin-bottom:8px}
.shh h2{flex:1;margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:13px 10px;border-radius:14px;font-size:15px}
.opt:hover{background:var(--accent-soft)}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{background:var(--chip);color:var(--chip-fg)}
.opt.dng{color:var(--danger)}
.lbl{font-size:12px;color:var(--muted);margin:14px 2px 8px;letter-spacing:.04em}
.papers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;padding:6px;border-radius:14px}
.pp canvas{width:100%;aspect-ratio:1/1.05;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.pp[aria-pressed="true"]{color:var(--accent);font-weight:600}
.pp[aria-pressed="true"] canvas{box-shadow:0 0 0 2.5px var(--accent)}
.cols{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.cb{aspect-ratio:1;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line);min-width:0}
.cb[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.cust{display:flex;align-items:center;gap:12px;margin-top:14px}
.cust input[type=color]{width:52px;height:40px;border:0;background:none;padding:0}
.field{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--desk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.th{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.th canvas{width:100%;height:auto;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.th[aria-current="true"] canvas{box-shadow:0 0 0 3px var(--accent)}
.th[aria-current="true"]{color:var(--accent);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.srow{display:grid;grid-template-columns:116px 1fr 50px;align-items:center;gap:10px;padding:6px 2px}
.srow input{accent-color:var(--accent);min-width:0;height:28px}
.srow .v{text-align:end;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.seg2{display:flex;gap:8px;flex-wrap:wrap}
.seg2 .btn[aria-pressed="true"]{background:var(--chip);color:var(--chip-fg);border-color:var(--chip)}
.zp{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--desk);margin-top:10px}
.confirm p{margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--desk);padding:10px 18px;border-radius:14px;z-index:30;max-width:88vw;text-align:center;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;direction:rtl}
#toast.on{opacity:1}

@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:21;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);width:min(80vw,280px)}
  .side.open{transform:none}
  .mtop .ib.tg{display:grid}
  .main{padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px))}
  .cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .chip{padding:9px 16px}
  .fab{width:62px;height:62px}
}
@media (prefers-reduced-motion: reduce){#toast,.side{transition:none}}
</style>
</head>

<script>
(function(){
'use strict';
var PW=1000, PH=1414, KEY='hibr.v1';
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
function el(tag,props){
  var n=document.createElement(tag);
  if(props){for(var k in props){
    if(k==='class')n.className=props[k];
    else if(k==='text')n.textContent=props[k];
    else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),props[k]);
    else n.setAttribute(k,props[k]);
  }}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;n.appendChild(typeof c==='string'?document.createTextNode(c):c)}
  return n;
}
function icon(id,sz){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','i');if(sz){s.style.width=sz+'px';s.style.height=sz+'px'}var u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#i-'+id);s.appendChild(u);return s}
function lum(h){h=String(h||'#ffffff').replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x}).join('');var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (.299*r+.587*g+.114*b)/255}

/* ---------- constants ---------- */
var PEN_QUICK=['#1b1f2a','#2745d8','#d6362f','#1f8a5b','#e08a00','#ffffff'];
var HL_QUICK=['#ffe14d','#ff9ec4','#8be39a','#86cbff','#ffb870'];
var PEN_ALL=['#000000','#374151','#6b7280','#a3a9b5','#d9dce3','#ffffff','#7c2d12','#92400e',
 '#b91c1c','#dc2626','#f97316','#f59e0b','#eab308','#84cc16','#16a34a','#0d9488',
 '#0891b2','#0284c7','#2563eb','#4f46e5','#7c3aed','#a21caf','#db2777','#e11d48',
 '#fca5a5','#fdba74','#fde047','#86efac','#5eead4','#7dd3fc','#a5b4fc','#f0abfc'];
var HL_ALL=['#ffe14d','#ffd24d','#ffb870','#ff9ec4','#ff8fa3','#e9a8ff','#b6a6ff','#86cbff','#7de3e3','#8be39a','#c4e86b','#f5f58a','#ffffff','#c9ccd6','#ffcfa8','#d6f5a8'];
var PAPER_COLS=[['#ffffff','أبيض'],['#fbf4dc','كريمي'],['#fff6a8','أصفر'],['#e6f0ff','أزرق فاتح'],['#e4f5e8','أخضر فاتح'],['#fde8ef','وردي'],['#e8eaf0','رمادي'],['#2a2d3a','رمادي غامق'],['#15302a','سبورة خضراء'],['#0b0d14','ليلي'],['#000000','أسود']];
var RANGE={pen:[1,14],hl:[10,50],er:[10,80]};
var KINDS=[['blank','سادة'],['lined','سطور'],['wide','سطور عريضة'],['grid','مربعات'],['grids','مربعات صغيرة'],['dots','نقاط'],['iso','متساوي القياس'],['cornell','كورنيل'],['music','نوتة موسيقية']];

/* ---------- state ---------- */
function newPage(kind,bg,size,land){return {id:uid(),paper:kind||'lined',bg:bg||'#ffffff',size:size==='a3'?'a3':'a4',land:!!land,strokes:[]}}
function newNote(name,kind,bg,size,land){var t=Date.now();return {id:uid(),name:name,pages:[newPage(kind,bg,size,land)],fav:false,trash:0,created:t,updated:t}}
function seed(){
  var n=newNote('ملاحظتي الأولى','lined','#ffffff','a4',false);
  return {nbs:[n],cur:n.id,pg:0,tool:'pen',col:{pen:PEN_QUICK[0],hl:HL_QUICK[0]},size:{pen:3,hl:24,er:30,shape:4,txt:48},shape:'rect',shapeFill:false,cont:true,folders:[],recent:[],pen:{snap:true,kind:'ball',smooth:2,sens:100,ang:40,taper:true,speed:true,alpha:100,hlAlpha:55,penOnly:false},lastPaper:{paper:'lined',bg:'#ffffff',size:'a4',land:false},filter:'all',sort:'recent',mode:'grid'}
}
var storageOk=true;
function normalize(d){
  var base=seed();
  d.col=Object.assign(base.col,d.col||{});d.size=Object.assign(base.size,d.size||{});
  ['recent','lastPaper','filter','sort','mode','tool','pg','shape','shapeFill','cont','folders'].forEach(function(k){if(d[k]==null)d[k]=base[k]});
  d.pen=Object.assign(base.pen,d.pen||{});d.lastPaper=Object.assign(base.lastPaper,d.lastPaper||{});
  d.nbs.forEach(function(n){
    n.fav=!!n.fav;n.trash=n.trash||0;n.created=n.created||Date.now();n.updated=n.updated||n.created;
    n.folder=n.folder||null;n.tags=Array.isArray(n.tags)?n.tags:[];
    if(!n.pages||!n.pages.length)n.pages=[newPage()];
    n.pages.forEach(function(p){if(!p.bg)p.bg='#ffffff';if(!p.paper)p.paper='lined';if(p.size!=='a3')p.size='a4';p.land=!!p.land;if(!p.id)p.id=uid();if(!Array.isArray(p.strokes))p.strokes=[]});
  });
  if(d.cur==null&&d.nb!=null&&d.nbs[d.nb])d.cur=d.nbs[d.nb].id;
  if(!d.nbs.some(function(n){return n.id===d.cur}))d.cur=d.nbs.length?d.nbs[0].id:null;
  return d;
}
function loadOld(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return null;
    var d=JSON.parse(raw);
    if(!d||!Array.isArray(d.nbs)||!d.nbs.length)return null;
    return normalize(d);
  }catch(e){return null}
}
/* IndexedDB: meta + one record per note + one record per page */
var IDB=null,ready=false,savedNote={},savedPg={},dirtyPg={},lastMeta='';
function markPg(id){dirtyPg[id]=1}
function markAllPg(nb){nb.pages.forEach(function(p){dirtyPg[p.id]=1})}
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('no idb'));return}
    var r=indexedDB.open('hibr',1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('meta');d.createObjectStore('notes',{keyPath:'id'});d.createObjectStore('pages',{keyPath:'id'})};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.onblocked=function(){rej(new Error('blocked'))};
  });
}
function idbReq(rq){return new Promise(function(res,rej){rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){rej(rq.error)}})}
async function idbLoad(db){
  var tx=db.transaction(['meta','notes','pages'],'readonly');
  var meta=await idbReq(tx.objectStore('meta').get('state'));
  var notes=await idbReq(tx.objectStore('notes').getAll());
  var pages=await idbReq(tx.objectStore('pages').getAll());
  if(!meta)return null;
  var byId={};pages.forEach(function(p){byId[p.id]=p});
  var nbs=notes.sort(function(a,b){return (a.created||0)-(b.created||0)}).map(function(n){
    var pg=(n.pageIds||[]).map(function(id){return byId[id]}).filter(Boolean);
    var o=Object.assign({},n);delete o.pageIds;o.pages=pg;return o;
  });
  var d=Object.assign({},meta);d.nbs=nbs;return d;
}
function noteMeta(n){var o=Object.assign({},n);delete o.pages;o.pageIds=n.pages.map(function(p){return p.id});return o}
function noteFp(n){return JSON.stringify(noteMeta(n))}
function save(){
  clearTimeout(saveT);
  if(!ready)return;
  if(!IDB){
    try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}
    catch(e){storageOk=false;if(!warned){warned=true;toast('تعذّر الحفظ. صدّر نسخة احتياطية حتى لا تضيع ملاحظاتك.')}}
    return;
  }
  try{
    var tx=IDB.transaction(['meta','notes','pages'],'readwrite'),ms=tx.objectStore('meta'),ns=tx.objectStore('notes'),ps=tx.objectStore('pages');
    var seenN={},seenP={};
    S.nbs.forEach(function(n){
      seenN[n.id]=1;var f=noteFp(n);
      if(savedNote[n.id]!==f){ns.put(noteMeta(n));savedNote[n.id]=f}
      n.pages.forEach(function(p){
        seenP[p.id]=1;
        if(dirtyPg[p.id]||!savedPg[p.id]){ps.put(p);savedPg[p.id]=1}
      });
    });
    Object.keys(savedNote).forEach(function(id){if(!seenN[id]){ns.delete(id);delete savedNote[id]}});
    Object.keys(savedPg).forEach(function(id){if(!seenP[id]){ps.delete(id);delete savedPg[id]}});
    dirtyPg={};

/* ---------- export / import ---------- */
function saveFile(filename,data){
  var type=/\.pdf$/i.test(filename)?'application/pdf':/\.json$/i.test(filename)?'application/json':'application/octet-stream';
  var blob=data instanceof Blob?data:new Blob([data],{type:type});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},5000);
}
function safeName(s){return String(s).replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60)||'حبر'}
async function doSave(filename,data){
  try{saveFile(filename,data);toast('تم التصدير')}catch(err){toast('تعذّر التصدير')}
}

  try{

    var doc=new window.jspdf.jsPDF({unit:'pt',format:[Math.min(d0[0],d0[1]),Math.max(d0[0],d0[1])],orientation:d0[0]>d0[1]?'l':'p',compress:true});

async function importPdf(file){
  if(!window.pdfjsLib){toast('مكتبة PDF غير محمّلة');return}
  closeSide();
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
    var buf=await file.arrayBuffer();
    var doc=await pdfjsLib.getDocument({data:buf,standardFontDataUrl:'./'}).promise;
    var N=Math.min(doc.numPages,200),pages=[];
    for(var i=1;i<=N;i++){
      toast('جاري استيراد PDF… '+i+' / '+N);
      var pg=await doc.getPage(i),vp0=pg.getViewport({scale:1}),sh=Math.min(vp0.width,vp0.height);
      var sc=Math.min(1500/sh,3),vp=pg.getViewport({scale:sc});
      var c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:x,viewport:vp}).promise;
      var k=1000/Math.min(c.width,c.height);
      var p=newPage('blank','#ffffff','a4',false);p.bgImg=c.toDataURL('image/jpeg',.85);p.w=Math.round(c.width*k);p.h=Math.round(c.height*k);
      pages.push(p);c.width=c.height=1;
    }

    n.pages=pages;

    S.nbs.push(n);dirty();save();renderHome();toast('تم استيراد '+N+' صفحة. افتحها واكتب فوقها');

}

      if(!added)throw 0;
      dirty();closeSide();renderHome();toast('تم استيراد '+added+' ملاحظة');
    }catch(err){toast('الملف مو نسخة احتياطية من حبر')}
  };
  rd.readAsText(f);
});

/* ---------- home ---------- */
var query='';
var SORTS=[['recent','المستخدم مؤخرًا'],['created','الأحدث إنشاءً'],['name','الاسم']];
function closeSide(){$('#side').classList.remove('open');if(sheet.hidden)scrim.hidden=true}
$('#bSide').addEventListener('click',function(){$('#side').classList.add('open');scrim.hidden=false});
function hello(){var h=new Date().getHours();return (h>=17||h<5)?'طاب مساؤك':h<12?'صباح الخير':'طاب يومك'}
function fmtDate(t){
  var d=new Date(t),now=new Date(),tm=d.toLocaleTimeString('ar',{hour:'numeric',minute:'2-digit'});
  var sd=function(x){return x.getFullYear()*400+x.getMonth()*32+x.getDate()};
  var y=new Date(now);y.setDate(now.getDate()-1);
  if(sd(d)===sd(now))return 'اليوم، '+tm;
  if(sd(d)===sd(y))return 'أمس، '+tm;
  return d.toLocaleDateString('ar',{day:'numeric',month:'long'})+' '+tm;
}
function noteText(n){
  var o=[];
  n.pages.forEach(function(p){p.strokes.forEach(function(st){if(st.t==='text'&&st.txt)o.push(st.txt)})});
  return o.join(' ').toLowerCase();
}
function visibleNotes(){
  var f=S.filter,q=query.trim().toLowerCase();
  var list=S.nbs.filter(function(n){
    if(f==='trash'){if(!n.trash)return false}else{if(n.trash)return false;if(f==='fav'&&!n.fav)return false;if(f.slice(0,2)==='f:'&&n.folder!==f.slice(2))return false;if(f.slice(0,2)==='t:'&&(n.tags||[]).indexOf(f.slice(2))<0)return false}
    return !q||n.name.toLowerCase().indexOf(q)>=0||noteText(n).indexOf(q)>=0;
  });
  list.sort(function(a,b){
    if(S.sort==='name')return a.name.localeCompare(b.name,'ar');
    if(S.sort==='created')return b.created-a.created;
    return b.updated-a.updated;
  });
  return list;
}
function renderSideLists(){
  var box=$('#sideLists');box.replaceChildren();
  var live=S.nbs.filter(function(n){return !n.trash});
  box.appendChild(el('div',{class:'lbl',text:'المجلدات'}));
  S.folders.forEach(function(f){
    var cnt=live.filter(function(n){return n.folder===f.id}).length;
    var b=el('button',{class:'nv','data-f':'f:'+f.id,onclick:function(){S.filter='f:'+f.id;dirty();closeSide();renderHome()}},icon('home'),f.name,el('span',{class:'n',text:cnt||''}));
    box.appendChild(b);
    box.appendChild(el('button',{class:'nv',style:'padding-block:2px;font-size:12px;opacity:.7;min-height:0',onclick:function(){folderSheet(f)}},icon('edit'),'إدارة «'+f.name+'»'));
  });
  box.appendChild(el('button',{class:'nv',onclick:function(){folderSheet(null)}},icon('plus'),'مجلد جديد'));
  var tags={};live.forEach(function(n){(n.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1})});
  var tk=Object.keys(tags).sort();
  if(tk.length){
    box.appendChild(el('div',{class:'lbl',text:'الوسوم'}));
    tk.forEach(function(t){box.appendChild(el('button',{class:'nv','data-f':'t:'+t,onclick:function(){S.filter='t:'+t;dirty();closeSide();renderHome()}},icon('tag'),'#'+t,el('span',{class:'n',text:tags[t]})))});
  }
}
function folderSheet(f){
  var body=el('div'),inp=el('input',{class:'field',type:'text',maxlength:'40',placeholder:'اسم المجلد'});
  if(f)inp.value=f.name;
  var ok=function(){
    var nm=inp.value.trim();if(!nm)return;
    if(f)f.name=nm;else{var nf={id:uid(),name:nm};S.folders.push(nf);S.filter='f:'+nf.id}
    dirty();closeSheet();closeSide();renderHome();
  };
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')ok()});
  body.appendChild(el('div',{class:'cust',style:'margin-top:4px'},inp,el('button',{class:'btn pri',onclick:ok,text:'حفظ'})));
  if(f)body.appendChild(el('button',{class:'opt dng',onclick:function(){
    S.nbs.forEach(function(n){if(n.folder===f.id)n.folder=null});
    S.folders=S.folders.filter(function(x){return x!==f});
    if(S.filter==='f:'+f.id)S.filter='all';
    dirty();closeSheet();renderHome();toast('حُذف المجلد وبقيت ملاحظاته')}},icon('trash'),'حذف المجلد (الملاحظات تبقى)'));
  openSheet(f?'إدارة المجلد':'مجلد جديد',body);setTimeout(function(){inp.focus()},50);
}
function moveSheet(n){
  var body=el('div');
  body.appendChild(el('button',{class:'opt','aria-pressed':!n.folder?'true':'false',onclick:function(){n.folder=null;dirty();closeSheet();renderHome()}},icon('home'),'بدون مجلد'));
  S.folders.forEach(function(f){body.appendChild(el('button',{class:'opt','aria-pressed':n.folder===f.id?'true':'false',onclick:function(){n.folder=f.id;dirty();closeSheet();renderHome()}},icon('home'),f.name))});
  if(!S.folders.length)body.appendChild(el('div',{class:'empty',text:'ما في مجلدات بعد. أنشئ مجلد من القائمة الجانبية.'}));
  openSheet('نقل إلى مجلد',body);
}
function tagSheet(n){
  var body=el('div'),row=el('div',{class:'cols',style:'flex-wrap:wrap;gap:8px;margin:8px 0'});
  function draw(){
    row.replaceChildren();
    n.tags.forEach(function(t){row.appendChild(el('button',{class:'btn','aria-pressed':'true',onclick:function(){n.tags=n.tags.filter(function(x){return x!==t});dirty();draw();renderHome()}},'#'+t+' ✕'))});
    if(!n.tags.length)row.appendChild(el('div',{class:'empty',text:'ما في وسوم.'}));
  }
  var inp=el('input',{class:'field',type:'text',maxlength:'24',placeholder:'وسم جديد'});
  var add=function(){var t=inp.value.trim().replace(/^#/,'').replace(/\s+/g,'_');if(!t)return;if(n.tags.indexOf(t)<0)n.tags.push(t);inp.value='';dirty();draw();renderHome()};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')add()});
  body.appendChild(el('div',{class:'cust',style:'margin-top:4px'},inp,el('button',{class:'btn pri',onclick:add,text:'إضافة'})));
  body.appendChild(row);draw();
  var all={};S.nbs.forEach(function(x){(x.tags||[]).forEach(function(t){all[t]=1})});
  var sug=Object.keys(all).filter(function(t){return n.tags.indexOf(t)<0});
  if(sug.length){var r2=el('div',{class:'cols',style:'flex-wrap:wrap;gap:8px'});sug.forEach(function(t){r2.appendChild(el('button',{class:'btn',onclick:function(){n.tags.push(t);dirty();draw();renderHome()}},'+ #'+t))});body.appendChild(r2)}
  openSheet('الوسوم',body);
}
function renderHome(){
  renderSideLists();
  $('#hello').textContent=hello();
  var live2=S.nbs.filter(function(n){return !n.trash});
  $('#nAll').textContent=live2.length||'';
  $('#nFav').textContent=live2.filter(function(n){return n.fav}).length||'';
  $('#nTrash').textContent=S.nbs.filter(function(n){return n.trash}).length||'';
  document.querySelectorAll('.nv[data-f]').forEach(function(b){b.setAttribute('aria-current',b.dataset.f===S.filter?'true':'false')});
  document.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.f===S.filter?'true':'false')});
  $('#sortLbl').textContent=SORTS.filter(function(s){return s[0]===S.sort})[0][1];
  $('#bMode use').setAttribute('href',S.mode==='grid'?'#i-list':'#i-grid');
  $('#bEmpty').hidden=!(S.filter==='trash'&&S.nbs.some(function(n){return n.trash}));
  var box=$('#cards');box.replaceChildren();
  box.className='cards'+(S.mode==='list'?' list':'');
  var list=visibleNotes();
  if(!list.length){
    box.appendChild(el('div',{class:'empty',text:query?'ما لقيت ملاحظة بهذا الاسم أو بنص مكتوب فيها. البحث ما يقرأ الخط اليدوي.':S.filter==='trash'?'السلة فاضية.':S.filter==='fav'?'ما في ملاحظات مفضلة. افتح قائمة أي ملاحظة وأضفها للمفضلة.':'ما في ملاحظات بعد. اضغط + لتبدأ.'}));
    return;
  }
  list.forEach(function(n){
    var c=document.createElement('canvas');c.className='cth';c.width=420;c.height=315;
    fitPage(c,n.pages[0]);
    var title=el('div',{class:'cn'});
    if(n.fav){var st=icon('star',17);st.setAttribute('class','i star');st.style.fill='currentColor';title.appendChild(st)}
    title.appendChild(document.createTextNode(n.name));
    var menu=el('button',{class:'ib','aria-label':'خيارات',onclick:function(e){e.stopPropagation();cardSheet(n,'menu')}},icon('more',20));
    var card=el('article',{class:'card',tabindex:'0',role:'button','aria-label':n.name,onclick:function(){if(!n.trash)showEditor(n.id);else cardSheet(n,'menu')},onkeydown:function(e){if(e.key==='Enter'&&e.target===card&&!n.trash)showEditor(n.id)}},
      el('div',{class:'ch'},el('div',{class:'ct'},el('div',{class:'cd',text:fmtDate(n.updated)}),title),menu),c);
    box.appendChild(card);
  });
}
document.querySelectorAll('[data-f]').forEach(function(b){b.addEventListener('click',function(){S.filter=b.dataset.f;dirty();closeSide();renderHome()})});
$('#q').addEventListener('input',function(e){query=e.target.value;renderHome()});
$('#bMode').addEventListener('click',function(){S.mode=S.mode==='grid'?'list':'grid';dirty();renderHome()});
$('#bSort').addEventListener('click',function(){
  var body=el('div');
  SORTS.forEach(function(s){body.appendChild(el('button',{class:'opt','aria-pressed':S.sort===s[0]?'true':'false',onclick:function(){S.sort=s[0];dirty();closeSheet();renderHome()}},icon('sort'),s[1]))});
  openSheet('الترتيب',body);
});
$('#bEmpty').addEventListener('click',function(){
  openSheet('إفراغ السلة',el('div',{},el('div',{class:'confirm'},el('p',{text:'حذف كل ما في السلة نهائيًا؟ لا يمكن التراجع.'}),
    el('div',{class:'btns',style:'margin:0'},el('button',{class:'btn dng',onclick:function(){S.nbs=S.nbs.filter(function(n){return !n.trash});dirty();closeSheet();renderHome()},text:'إفراغ'}),el('button',{class:'btn',onclick:closeSheet,text:'إلغاء'})))));
});
function pad2(n){return (n<10?'0':'')+n}
$('#bNew').addEventListener('click',function(){
  var d=new Date(),n=newNote('ملاحظة جديدة '+pad2(d.getDate())+'-'+pad2(d.getMonth()+1)+'-'+d.getFullYear(),S.lastPaper.paper,S.lastPaper.bg,S.lastPaper.size,S.lastPaper.land);
  if(/^f:/.test(S.filter))n.folder=S.filter.slice(2);
  if(/^t:/.test(S.filter))n.tags=[S.filter.slice(2)];
  S.nbs.push(n);dirty();showEditor(n.id);
});
function cardSheet(n,mode){
  var body=el('div');
  if(mode==='rename'){
    var inp=el('input',{class:'field',type:'text',maxlength:'60'});inp.value=n.name;
    var ok=function(){n.name=inp.value.trim()||n.name;n.updated=Date.now();dirty();closeSheet();renderHome()};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')ok()});
    body.appendChild(el('div',{class:'cust',style:'margin-top:4px'},inp,el('button',{class:'btn pri',onclick:ok,text:'حفظ'})));
    openSheet('إعادة تسمية',body);setTimeout(function(){inp.focus();inp.select()},50);return;
  }
  if(mode==='confirm'){
    body.appendChild(el('div',{class:'confirm'},el('p',{text:'حذف «'+n.name+'» نهائيًا؟ لا يمكن التراجع.'}),
      el('div',{class:'btns',style:'margin:0'},el('button',{class:'btn dng',onclick:function(){S.nbs=S.nbs.filter(function(x){return x!==n});dirty();closeSheet();renderHome()},text:'حذف نهائي'}),el('button',{class:'btn',onclick:closeSheet,text:'إلغاء'}))));
    openSheet(n.name,body);return;
  }
  if(n.trash){
    body.appendChild(el('button',{class:'opt',onclick:function(){n.trash=0;dirty();closeSheet();renderHome()}},icon('restore'),'استعادة'));
    body.appendChild(el('button',{class:'opt dng',onclick:function(){cardSheet(n,'confirm')}},icon('trash'),'حذف نهائي'));
  }else{
    body.appendChild(el('button',{class:'opt',onclick:function(){showEditor(n.id);closeSheet()}},icon('pen'),'فتح'));
    body.appendChild(el('button',{class:'opt',onclick:function(){n.fav=!n.fav;dirty();closeSheet();renderHome()}},icon('star'),n.fav?'إزالة من المفضلة':'إضافة للمفضلة'));
    body.appendChild(el('button',{class:'opt',onclick:function(){cardSheet(n,'rename')}},icon('edit'),'إعادة تسمية'));
    body.appendChild(el('button',{class:'opt',onclick:function(){moveSheet(n)}},icon('home'),'نقل إلى مجلد'));
    body.appendChild(el('button',{class:'opt',onclick:function(){tagSheet(n)}},icon('tag'),'الوسوم'));
    body.appendChild(el('button',{class:'opt dng',onclick:function(){n.trash=Date.now();dirty();closeSheet();renderHome();toast('انتقلت إلى سلة المهملات')}},icon('trash'),'نقل إلى سلة المهملات'));
  }
  openSheet(n.name,body);
}

/* ---------- navigation ---------- */
function showHome(){
  cancelLive();clearSel();save();views=[];V=null;sig='';pagesEl.replaceChildren();
  view='home';$('#vEdit').hidden=true;$('#vHome').hidden=false;$('#bNew').hidden=false;
  try{if(location.hash==='#note')location.hash=''}catch(e){}
  renderHome();
}
function showEditor(id){
  S.cur=id;var nb=curNb();if(!nb)return;
  S.pg=Math.min(nb.lastPg||0,nb.pages.length-1);
  view='edit';zoom=1;sig='';
  $('#vHome').hidden=true;$('#vEdit').hidden=false;
  try{location.hash='note'}catch(e){}
  refreshTools();layout();gotoPage(S.pg);dirty();
}
$('#bBack').addEventListener('click',function(){var nb=curNb();if(nb)nb.lastPg=S.pg;showHome()});
window.addEventListener('hashchange',function(){if(view==='edit'&&location.hash!=='#note'){var nb=curNb();if(nb)nb.lastPg=S.pg;showHome()}});

/* ---------- boot ---------- */
async function boot(){
  var d=null,fromIdb=false;
  try{
    IDB=await idbOpen();
    d=await idbLoad(IDB);
    if(d){d=normalize(d);fromIdb=true}
    else{
      var migrated=false;try{migrated=!!localStorage.getItem(KEY+'.migrated')}catch(e){}
      var old=migrated?null:loadOld();
      if(old){d=old;try{localStorage.setItem(KEY+'.migrated','1')}catch(e){}}
    }
  }catch(e){
    IDB=null;d=loadOld();
  }
  S=d||seed();
  if(!S.nbs.length){var sd=seed();S.nbs=sd.nbs;S.cur=sd.cur}
  if(fromIdb){
    S.nbs.forEach(function(n){savedNote[n.id]=noteFp(n);n.pages.forEach(function(p){savedPg[p.id]=1})});
    var meta=Object.assign({},S);delete meta.nbs;lastMeta=JSON.stringify(meta);
  }
  ready=true;
  refreshTools();renderHome();
  save();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
boot();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
